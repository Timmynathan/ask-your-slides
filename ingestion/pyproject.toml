[project]
name = "pau-ingestion"
version = "0.1.0"
description = "Loads course materials from data/manifest.yaml into Supabase"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic",
  "httpx",
  "psycopg[binary]",
  "pymupdf",
  "python-dotenv",
  "python-pptx",
  "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
